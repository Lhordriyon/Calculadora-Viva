name: CI e deploy

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Verificar (tipos, testes, conteúdo, túnel, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run checar
      - run: npm test
      - run: npm run validar
      - name: Túnel de vento (falha se uma meta da fase 1 quebrar)
        run: npm run tunel -- --sem-arquivo
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Guardar o site para publicar
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  publicar:
    name: Publicar no GitHub Pages
    needs: verificar
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Conferir se o GitHub Pages publica via Actions
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tipo="$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || true)"
          if [ "$tipo" = "workflow" ]; then
            echo "ativo=true" >> "$GITHUB_OUTPUT"
          else
            echo "ativo=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=GitHub Pages desligado::Ative em Settings > Pages > Build and deployment > Source: GitHub Actions e rode este workflow de novo (Actions > CI e deploy > Run workflow)."
          fi
      - name: Publicar
        id: deploy
        if: steps.pages.outputs.ativo == 'true'
        uses: actions/deploy-pages@v5
